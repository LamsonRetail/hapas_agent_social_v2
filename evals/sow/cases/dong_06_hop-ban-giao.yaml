# SOW 6 — Họp dự án và phối hợp liên phòng ban. Skill: skills/hop-va-ban-giao.md
# (SOW 5 có file riêng dong_05_tien-do.yaml; ca d06e giữ hồi quy định tuyến: hỏi trễ hạn → tra_tien_do.)

# Ghi chép cài sẵn: 6 việc; việc 3 và 5 thiếu người; việc 6 thiếu hạn;
# mâu thuẫn: Media giao ảnh 25/10 nhưng Booking cần ảnh 22/10.
# người chấm: liệt kê đủ 6/6 việc, giữ nguyên chữ ghi chép; nêu mâu thuẫn 25/10 vs 22/10 kèm hai câu gốc;
# không bịa tên người; việc chỉ có bộ phận có câu "Ai cụ thể ở <bộ phận>…" trong VẤN ĐỀ CHƯA CHỐT.
- description: "SOW 6 · Ghi chép họp — tách 6 việc, đánh dấu 2 thiếu người + 1 thiếu hạn, nêu mâu thuẫn 25/10 vs 22/10"
  metadata: {sow_dong: 6, hang_muc: "Họp dự án và phối hợp liên phòng ban"}
  vars:
    ma: d06a
    hoi: |-
      Đây là ghi chép họp dự án 20.10 hôm 15/10, tách giúp mình quyết định và việc:
      1) Media giao 30 ảnh sản phẩm, hạn 25/10.
      2) Booking gửi ảnh sản phẩm cho KOC ngày 22/10, cần nhận ảnh từ Media trước ngày đó.
      3) Làm POSM cho 3 cửa hàng, hạn 19/10.
      4) Kinh doanh chốt giá ưu đãi trước 18/10.
      5) Viết caption 10 bài cho fanpage, hạn 20/10.
      6) Bán lẻ hướng dẫn nhân viên cửa hàng về quà tặng.
    luot_truoc: []
  assert:
    - type: python
      value: file://kiem.py:nap_ky_nang
      config: {ten: "Họp dự án và bàn giao liên phòng ban"}
    - type: python
      value: file://kiem.py:dem_it_nhat
      config: {cum: "CHƯA CÓ NGƯỜI", n: 2}
    - type: python
      value: file://kiem.py:dem_it_nhat
      config: {cum: "CHƯA CÓ HẠN", n: 1}
    - type: icontains-all
      value: ["22/10", "25/10", "mâu thuẫn", "6 việc"]
    - type: not-icontains
      value: "Mark không thể"

# người chấm: số phút các mục cộng đúng 30; 5 phút cuối đọc lại quyết định/việc/người/hạn;
# câu hỏi cho Media có định dạng, số lượng, hạn trả; cho Booking có KOC, ngày đăng, tư liệu cần.
- description: "SOW 6 · Chương trình họp 30 phút Media + Booking — thời lượng từng mục, quyết định cần chốt, câu hỏi theo bên"
  metadata: {sow_dong: 6, hang_muc: "Họp dự án và phối hợp liên phòng ban"}
  vars:
    ma: d06b
    hoi: |-
      Soạn chương trình họp 30 phút với Media và Booking về buổi shooting tuần sau.
    luot_truoc: []
  assert:
    - type: python
      value: file://kiem.py:nap_ky_nang
      config: {ten: "Họp dự án và bàn giao liên phòng ban"}
    - type: python
      value: file://kiem.py:dem_it_nhat
      config: {cum: "QUYẾT ĐỊNH CẦN CHỐT", n: 3}
    - type: icontains-all
      value: ["30 phút", "CÂU HỎI CHO", "TÀI LIỆU ĐỌC TRƯỚC", "Media", "Booking"]

# người chấm: danh sách đủ 3 việc của lượt trước, cột DEADLINE chỉ ngày yyyy/MM/dd hoặc trống,
