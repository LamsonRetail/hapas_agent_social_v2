# SOW 7 — Theo dõi ngân sách từng chiến dịch. Skill: skills/theo-doi-ngan-sach.md
# Đáp án tab BẢNG TỔNG (đọc chỉ-đọc ngày 06/10): dòng TỔNG NGÂN SÁCH = 8.385.649.200;
# TỔNG thực tế cột (18.9) = 7.919.960.726; cột (5.10) chưa có công thức tổng (dòng TỔNG = 0).
# 07/10/2026: tổng tự tính nay do `dem_bang` cộng (bỏ luật "bảng >20 dòng không tự cộng"). Số tính ĐỘC
# LẬP, không qua dem_bang_tool: script riêng đọc dump lark-cli của tab f99011, bỏ "₫" và dấu phẩy nghìn,
# cộng bằng Decimal; rồi chạy dem_bang trên cùng dump — khớp:
#   cột (5.10) cộng các dòng chi tiết = 2.053.550.950 (dòng nhóm và dòng TỔNG của cột này trống/0);
#   PRODUCTION: dòng 23–25 = 2.541.849.200 = ô nhóm; dòng 23–27 (gồm SẢN XUẤT CONTENT) = 2.581.849.200;
#   5 nhóm cấp cao (dòng 4, 17, 22, 28, 43) = 8.385.649.200 = dòng TỔNG.

# người chấm: chỉ ra cột thực tế 5.10 có số ở dòng chi tiết (tổng 2.053.550.950 do công cụ cộng) mà dòng
# TỔNG trống/0; tổng tự tính ghi rõ là công cụ cộng, không phải số tự cộng; chỉ ra SẢN XUẤT CONTENT
# đứng ngoài tổng PRODUCTION; nêu bảng thiếu cột đã cam kết / đã thanh toán / dự kiến cuối kỳ; danh sách
# vượt ghi "có thể chưa đủ, lọc cột Chênh lệch < 0"; không chép tên KOL/nghệ sĩ trong tên hạng mục.
- description: "SOW 7 · Rà BẢNG TỔNG — tổng dự toán ≈8,39 tỷ, thực tế ≈7,92 tỷ, khoản ngoài tổng, cột còn thiếu"
  metadata: {sow_dong: 7, hang_muc: "Theo dõi ngân sách từng chiến dịch"}
  vars:
    ma: d07a
    hoi: |-
      /bang https://o4pvcegwn6b.sg.larksuite.com/sheets/OsbvsgC1chru5mtG7RFli2vFg1b?sheet=f99011 tab BẢNG TỔNG: cho mình tổng dự toán, thực tế, chênh lệch, hạng mục vượt và lỗi cộng tổng nếu có
    luot_truoc: []
  assert:
    - type: python
      value: file://kiem.py:nap_ky_nang
      config: {ten: "Theo dõi ngân sách chiến dịch"}
    - type: python
      value: file://kiem.py:goi_tool
      config: {ten: "dem_bang"}
    - type: icontains-any
      value: ["8.385", "8,385", "8385", "8,39", "8.39"]
    - type: icontains-any
      value: ["7.919", "7,919", "7919", "7,92", "7.92"]
    # Sheet này team còn cập nhật (07/10 đã khác bản dump 06/10) nên KHÔNG chấm con số cụ thể ở đây;
    # số do dem_bang cộng (chấm ở goi_tool), người chấm đối chiếu số với Sheet lúc chạy.
    - type: regex
      value: '\d{1,3}(\.\d{3}){2,}'
    - type: icontains-all
      value: ["SẢN XUẤT CONTENT", "cam kết", "dự kiến cuối kỳ"]

# người chấm: không dùng bảng markdown; liệt kê ≥5 khoản dễ sót (VAT/thuế TNCN, vận chuyển, overtime,
# in lại, quà/merch, phí nền tảng, setup/dọn địa điểm, phí agency).
- description: "SOW 7 · Lập mẫu theo dõi ngân sách pop-up 200 triệu — đủ 16 cột, công thức, dự phòng bằng VND"
  metadata: {sow_dong: 7, hang_muc: "Theo dõi ngân sách từng chiến dịch"}
  vars:
    ma: d07b
    hoi: |-
      Lập giúp mình mẫu theo dõi ngân sách cho event pop-up 200 triệu
    luot_truoc: []
  assert:
    - type: python
      value: file://kiem.py:nap_ky_nang
      config: {ten: "Theo dõi ngân sách chiến dịch"}
    - type: icontains-all
      value: ["Dự toán duyệt", "Đã cam kết", "Đã thanh toán", "Dự kiến cuối kỳ", "Chênh lệch", "Chứng từ", "dự phòng", "VAT"]
    # Dự phòng 10–15% của 200 triệu: chấp nhận khoảng "20–30 triệu" hoặc một mức % trong 10–15.
    - type: regex
      value: '20\s*[–-]\s*30 triệu|(?:1[0-5])(?:[,.]\d+)?\s*%'

# Đáp án tính độc lập (tay, rồi kiểm bằng Python Decimal): 85.000.000 + 12.000.000 + 6.000.000 =
# 103.000.000; 103.000.000 − 90.000.000 = 13.000.000; 13.000.000 ÷ 90.000.000 = 0,1444… → 14,4% (ĐỎ, >5%).
# "13,5" dưới đây KHÔNG phải tỷ lệ vượt: là mức trên của dự phòng 15% × 90 triệu = 13,5 triệu (9–13,5 triệu).
# 07/10/2026: phép tính phải do `tinh` làm (Mark không tự cộng/chia), Mark chép `cau_tinh`.
# người chấm: ghép báo giá với hạng mục kế hoạch; phép tính chép từ công cụ; nói tổng có thể còn tăng.
- description: "SOW 7 · Đối chiếu báo giá booth 103 triệu vs duyệt 90 triệu — tinh tính 14,4%, mức ĐỎ, khoản dễ sót, dự phòng VND"
  metadata: {sow_dong: 7, hang_muc: "Theo dõi ngân sách từng chiến dịch"}
  vars:
    ma: d07c
    hoi: |-
      Đây là báo giá bên setup booth mình dán: dựng booth 85.000.000, in ấn 12.000.000, vận chuyển 6.000.000. Kế hoạch duyệt cho hạng mục này là 90 triệu. Đối chiếu giúp mình.
    luot_truoc: []
  assert:
    - type: python
      value: file://kiem.py:nap_ky_nang
      config: {ten: "Theo dõi ngân sách chiến dịch"}
    - type: icontains-all
      value: ["103", "13", "ĐỎ", "VAT", "ngưỡng đề xuất"]
    - type: icontains-any
      value: ["14,4", "14.4"]
    - type: python
      value: file://kiem.py:goi_tool
      config: {ten: "tinh"}
    - type: icontains-any
      value: ["tháo dỡ", "dọn địa điểm", "dọn dẹp"]
    # Dự phòng 10–15% của 90 triệu = 9–13,5 triệu (không phải tỷ lệ vượt).
    - type: icontains-any
      value: ["13,5", "13.5"]

# 07/10/2026 — báo giá DÁN dạng bảng (6 dòng) vs dự toán 150 triệu: cộng bằng dem_bang (du_lieu), tỷ lệ
# bằng tinh. Đáp án tính độc lập (Python Decimal trên đúng các số dưới):
#   48.500.000 + 36.000.000 + 22.750.000 + 18.000.000 + 9.600.000 + 7.250.000 = 142.100.000;
#   150.000.000 − 142.100.000 = 7.900.000 (còn dư, chưa vượt); 142.100.000 ÷ 150.000.000 = 94,7% dự toán.
# người chấm: tổng do công cụ cộng (không "số tự cộng"); nói chưa vượt nhưng còn khoản dễ sót (VAT,
# tháo dỡ, dự phòng) có thể đẩy quá dự toán; dự phòng ghi bằng VND.
- description: "SOW 7 · Báo giá pop-up DÁN dạng bảng 6 dòng vs 150 triệu — dem_bang cộng trên du_lieu, tinh tính tỷ lệ"
  metadata: {sow_dong: 7, hang_muc: "Theo dõi ngân sách từng chiến dịch"}
  vars:
    ma: d07d
    hoi: |-
      Báo giá bên agency gửi cho pop-up, dự toán duyệt 150 triệu. Kiểm giúp có vượt không:
      Hạng mục | Thành tiền
      Thiết kế và dựng quầy | 48.500.000
      Thuê mặt bằng 3 ngày | 36.000.000
      In ấn POSM | 22.750.000
      Nhân sự PG 3 ngày | 18.000.000
      Quà tặng khách | 9.600.000
      Vận chuyển | 7.250.000
    luot_truoc: []
  assert:
    - type: python
      value: file://kiem.py:nap_ky_nang
      config: {ten: "Theo dõi ngân sách chiến dịch"}
    - type: python
      value: file://kiem.py:goi_tool
      config: {ten: "dem_bang", co_tham_so: "du_lieu"}
    - type: python
      value: file://kiem.py:goi_tool
