# SOW 21 — Báo cáo tổng hợp chiến dịch Marketing: hỏi thẳng số liệu dashboard lắng nghe social.hapas.vn
# (tool hoi_dashboard, 17/10/2026). Chỉ đọc, miễn phí: KHÔNG hỏi "Chạy nhé?", KHÔNG quét mới bằng
# social_listen. Máy chạy nghiệm thu thường không nối được kho lang_nghe (Postgres trên VPS) — khi đó
# tool báo "Chưa đọc được kho", Mark phải nói chưa có số + đưa link dashboard, không bịa số.

# người chấm: có số thì chép đúng số/% kèm kỳ + kỳ so sánh + link; không số thì nói rõ chưa đọc được,
# không đoán %. Không nêu tên người bình luận.
- description: "SOW 21 · Hỏi dashboard — tổng quan 7 ngày + % tiêu cực, đọc dashboard, không quét mới"
  metadata: {sow_dong: 21, hang_muc: "Báo cáo tổng hợp chiến dịch Marketing"}
  vars:
    ma: d21c
    hoi: "Dashboard lắng nghe HAPAS 7 ngày qua thế nào rồi? Tiêu cực bao nhiêu %?"
    luot_truoc: []
  assert:
    - type: python
      value: file://kiem.py:goi_tool
      config: {ten: "hoi_dashboard"}
    - type: icontains
      value: "social.hapas.vn"
    - type: not-icontains
      value: "Chạy nhé"

# người chấm: kỳ mơ hồ — hỏi lại ngày bắt đầu/kết thúc bằng MỘT câu, hoặc nói rõ đang dùng 30 ngày trọn
# gần nhất như dashboard. Không tự chế "đợt" là ngày nào.
- description: "SOW 21 · Hỏi dashboard — kỳ mơ hồ 'đợt vừa rồi': hỏi lại kỳ hoặc nói rõ mặc định 30 ngày"
  metadata: {sow_dong: 21, hang_muc: "Báo cáo tổng hợp chiến dịch Marketing"}
  vars:
    ma: d21d
    hoi: "Số liệu lắng nghe đợt vừa rồi của HAPAS ra sao em?"
    luot_truoc: []
  assert:
    - type: python
      value: file://kiem.py:nap_ky_nang
      config: {ten: "Hỏi đáp số liệu dashboard lắng nghe"}
    - type: icontains-any
      value: ["30 ngày", "từ ngày", "kỳ nào", "khoảng thời gian", "ngày nào", "đợt nào"]

# người chấm: chi phí là USD thật đã tiêu trong tháng (+ dự báo tối đa, trần); kèm link trang Ngân sách.
- description: "SOW 21 · Hỏi dashboard — chi phí quét tháng này, đọc phần chi_phi"
  metadata: {sow_dong: 21, hang_muc: "Báo cáo tổng hợp chiến dịch Marketing"}
  vars:
    ma: d21e
    hoi: "Tháng này dự án HAPAS trên dashboard quét hết bao nhiêu tiền rồi, có vượt trần không?"
    luot_truoc: []
  assert:
    - type: python
      value: file://kiem.py:goi_tool
      config: {ten: "hoi_dashboard", co_tham_so: "phan"}
    - type: icontains-any
      value: ["USD", "social.hapas.vn"]
